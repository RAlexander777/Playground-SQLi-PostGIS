version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: catastro_sqli_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgis_secure_pass_2026
      - POSTGRES_DB=catastro_sqli_db
    ports:
      - "5488:5432"
    volumes:
      - pgdata_sqli:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catastro_sqli_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: catastro_sqli_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8020:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgis_secure_pass_2026@db:5432/catastro_sqli_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_sqli:
